<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>半影 // 你确定那是你的名字吗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{
  background:#000;color:#cfccca;min-height:100vh;overflow:hidden;
  font-family:Georgia,'Songti SC','STSong','SimSun',serif;
  display:flex;align-items:center;justify-content:center;
}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.82) 100%);}
#scan{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.2;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.2) 3px,transparent 4px);}
.corner{position:fixed;z-index:3;font-family:'Courier New',monospace;font-size:10px;letter-spacing:.22em;color:rgba(130,135,150,.4);pointer-events:none;user-select:none;}
.corner.tl{top:14px;left:16px;}
.corner.br{bottom:14px;right:16px;}

main{position:relative;z-index:4;text-align:center;width:min(88vw,540px);}
.tag{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.4em;color:#6a7288;margin-bottom:2.6rem;}

.name{
  font-family:'Courier New',monospace;font-size:clamp(1.8rem,9vw,3.2rem);letter-spacing:.34em;padding-left:.34em;
  color:#e6c9a0;text-shadow:0 0 24px rgba(230,201,160,.4);margin-bottom:1.4rem;word-break:break-all;
}

.q{font-style:italic;font-size:1.05rem;color:#e9e7e4;letter-spacing:.1em;margin-bottom:2.8rem;opacity:0;transition:opacity 2s ease;}
.q.in{opacity:1;}

.line{opacity:0;transform:translateY(10px);transition:opacity 1.4s ease,transform 1.4s ease;font-size:.92rem;line-height:2.2;color:#9a9995;margin-bottom:.5rem;}
.line.in{opacity:1;transform:none;}
.line .dim{color:#6a7288;}

.links{margin-top:3rem;opacity:0;transition:opacity 1.6s ease;}
.links.in{opacity:1;}
.links a{
  display:inline-block;margin:0 8px 12px;padding:12px 26px;text-decoration:none;color:#b8c2ee;
  border:1px solid rgba(160,175,255,.3);font-family:'Courier New',monospace;font-size:11px;letter-spacing:.3em;transition:all .3s;
}
.links a:hover{background:rgba(160,175,255,.12);color:#fff;}
.links a.ghost{color:rgba(130,135,150,.7);border-color:rgba(255,255,255,.12);}
</style>
</head>
<body>
<div id="vignette"></div>
<div id="scan"></div>
<div class="corner tl">UMBRA · 半影</div>
<div class="corner br">UMB-2847-X · 未闭合</div>

<main>
  <div class="tag">— 档案已重新打开 —</div>
  <div class="name" id="name">NOX</div>
  <div class="q" id="q">你确定那是你的名字吗？</div>

  <div class="line" id="l1">这个名字，已经被<span class="dim">记录</span>了。</div>
  <div class="line" id="l2">真名留在半影。代号才能进来。</div>
  <div class="line" id="l3">你留下的，是代号。不是名字。</div>
  <div class="line" id="l4"><span class="dim">门还在。信号 62%。本影深度 2847。</span></div>
  <div class="line" id="l5">它在等下一个名字。</div>

  <div class="links" id="links">
    <a href="corridor.html">→ 重新进入走廊</a>
    <a class="ghost" href="门.html">回到终端</a>
  </div>
</main>

<script>
(function(){
  var n = 'NOX';
  try { if(sessionStorage.getItem('umbra.name')) n = sessionStorage.getItem('umbra.name'); } catch(e){}
  document.getElementById('name').textContent = n;

  setTimeout(function(){ document.getElementById('q').classList.add('in'); }, 800);
  var lines = ['l1','l2','l3','l4','l5'];
  lines.forEach(function(id, i){
    setTimeout(function(){ document.getElementById(id).classList.add('in'); }, 2400 + i * 1200);
  });
  setTimeout(function(){ document.getElementById('links').classList.add('in'); }, 2400 + lines.length * 1200 + 600);
})();
</script>
</body>
</html>
